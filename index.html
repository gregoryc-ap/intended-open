<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Intended</title>
<style>
  :root{
    --paper:#F6F1EA; --ink:#1C1917; --muted:#6B645C; --line:#E4D9CC;
    --accent:#8C4A2F; --card:#FFFcf7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:Georgia,"Iowan Old Style",serif;-webkit-text-size-adjust:100%;}
  .phone{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
  header.top{padding:22px 22px 10px;border-bottom:1px solid var(--line)}
  header.top .brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{font-weight:500;font-size:28px;line-height:1.2;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:14px;line-height:1.45}
  main{flex:1;padding:18px 22px 110px;overflow:auto}
  .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  .letterhead{border-top:1px solid var(--ink);padding-top:12px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row b{font-weight:500;text-align:right}
  .muted{color:var(--muted);font-size:14px}
  p{line-height:1.5}
  button{appearance:none;border:0;background:var(--ink);color:var(--paper);
    padding:14px 16px;width:100%;font-family:inherit;font-size:16px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;
    background:var(--paper);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{background:transparent;color:var(--muted);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;padding:16px 4px}
  nav.tabs button.on{color:var(--ink)}
  .brief{background:var(--card);border:1px solid var(--line);padding:16px;margin:12px 0}
  .brief .job{font-size:18px;margin:0 0 6px}
  .msg{margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line)}
  .msg.us{margin-left:24px;background:#F3EBE0}
  .notice{background:#F3EBE0;padding:14px;border:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const YOU = {
  name:"Lane & Mora", city:"Atlanta", county:"Fulton",
  hours:{lawyer:3, therapist:4, clinician:2, planner:1.5}, guide:"Avery"
};
const POOL = [
  {id:"jordan", name:"Jordan", city:"Decatur", inside:true, door:"together",
    job:"Wants to raise a child with you",
    letter:"I want to be a parent on paper, not a visitor. Same schools. I will not move the child out of this part of Atlanta.",
    agree:["Both of you want to be legal parents","A clinic, not home","Two homes in the same city"],
    decide:["Which school district","How a new partner shows up in year one"],
    conflict:[]},
  {id:"priya", name:"Priya", city:"Atlanta", inside:true, door:"together",
    job:"Wants to raise a child with you",
    letter:"I want a child who knows both parents from the first day. Public school. I do not want to live in the same house.",
    agree:["Both of you want to be legal parents","Atlanta","A clinic"],
    decide:["One home or two","Faith in the home"],
    conflict:[]},
  {id:"sam", name:"Sam", city:"Savannah", inside:false, door:"together",
    job:"Wants to raise a child with you",
    letter:"I would parent with someone who will stay in Georgia. I can visit. I cannot move in the first year.",
    agree:["Both of you want to be legal parents","Give birth in Georgia"],
    decide:["Where the child sleeps"],
    conflict:["You asked to stay within fifty miles. Savannah is farther than that."]},
  {id:"riley", name:"Riley", city:"Atlanta", inside:true, door:"witness",
    job:"Would help you conceive — not as a parent",
    letter:"I can help at a clinic. I will not be on the birth certificate.",
    agree:[], decide:[], conflict:[]},
  {id:"alex", name:"Alex", city:"Brooklyn", inside:false, door:"together",
    job:"Wants to raise a child with you", letter:"Looking for a parent in New York.",
    agree:[], decide:[], conflict:[]}
];
let view = "record";
let selected = null;
let widen = false;
function visiblePool(){
  return POOL.filter(p => p.door==="together" && (p.inside || widen) && p.city!=="Brooklyn");
}
function go(v,id){ view=v; if(id) selected=id; render(); }
function render(){
  const el = document.getElementById("app");
  const screens = {record, year, work, intros, brief, thread, refusal};
  el.innerHTML = (screens[view]||record)() + tabs();
  bind();
}
function tabs(){
  if(["brief","thread","refusal"].includes(view)) return "";
  const t = (id,label) => `<button class="${view===id?"on":""}" data-go="${id}">${label}</button>`;
  return `<nav class="tabs">${t("record","Plan")}${t("year","Support")}${t("work","Papers")}${t("intros","People")}</nav>`;
}
function record(){
  return `<header class="top"><div class="brand">Intended</div>
    <h1>${YOU.name}</h1>
    <div class="sub">You are not cleared to start a pregnancy yet.</div></header>
    <main>
      <div class="letterhead">
        <div class="label">Your plan</div>
        <div class="row"><span>You are here to</span><b>Raise a child together</b></div>
        <div class="row"><span>You live in</span><b>${YOU.city}</b></div>
        <div class="row"><span>Birth would be in</span><b>Georgia</b></div>
        <div class="row"><span>How you would conceive</span><b>At a clinic</b></div>
      </div>
      <div class="label">How Georgia treats parents like you</div>
      <p class="muted">Georgia often will not name both of you as parents before the baby is born. You should plan to finish the legal work after birth unless a lawyer writes another path.</p>
      <div class="stack">
        <button data-go="year">See your year of support</button>
        <button class="ghost" data-go="intros">See people nearby</button>
      </div>
    </main>`;
}
function year(){
  const h = YOU.hours;
  const row = (n,left,opened) => `<div class="row"><span>${n}</span><b>${left} left</b></div><div class="muted" style="margin-top:-6px;margin-bottom:8px">${opened}</div>`;
  return `<header class="top"><div class="brand">Your year · $2,999</div>
    <h1>Time with real people, when you need it.</h1>
    <div class="sub">Priced as if you will use every hour. Avery keeps this organized. Avery is not your lawyer.</div></header>
    <main>
      ${row("A lawyer", h.lawyer, "When you are talking with someone, or already have them")}
      ${row("A therapist", h.therapist, "When you are talking with someone")}
      ${row("A clinician", h.clinician, "Before anyone says you are ready to try")}
      ${row("A money planner", h.planner, "Half an hour already used")}
      <p class="muted">The first therapist visit walks through where you agree and where you do not — before anyone books a clinic.</p>
      <div class="stack"><button data-go="intros">See people nearby</button></div>
    </main>`;
}
function work(){
  return `<header class="top"><div class="brand">Papers</div>
    <h1>What is finished, and what is not.</h1>
    <div class="sub">Medical treatment is not part of this.</div></header>
    <main>
      <div class="row"><span>Planning notes</span><b>Started</b></div>
      <div class="row"><span>Letters from lawyers</span><b>Not yet</b></div>
      <div class="row"><span>Money conversation</span><b>Started</b></div>
      <div class="row"><span>Birth certificate</span><b>Not yet</b></div>
      <p class="muted">When you choose a clinic, it lives here as a note. We do not run the cycle.</p>
    </main>`;
}
function intros(){
  const list = visiblePool();
  const cards = list.map(p => `
    <div class="brief">
      <div class="job">${p.job}</div>
      <div class="muted">${p.name} · ${p.city}</div>
      <p>${p.letter}</p>
      <div class="label">Where you stand</div>
      <div class="ledger">
        <div class="row"><span>You already agree</span><b>${p.agree.length}</b></div>
        <div class="row"><span>You still need to decide</span><b>${p.decide.length}</b></div>
        <div class="row"><span>You do not agree</span><b>${p.conflict.length}</b></div>
      </div>
      <div class="stack"><button data-brief="${p.id}">Read their plan</button></div>
    </div>`).join("");
  return `<header class="top"><div class="brand">People nearby</div>
    <h1>People who want to raise a child with you</h1>
    <div class="sub">Same city, same county, or about fifty miles. We will not show how many miles.</div></header>
    <main>
      <div class="notice">Someone in Atlanta who only wants to donate sperm is not on this list. Someone in New York is not on this list.</div>
      ${cards}
      ${!widen ? `<p class="muted">There are people farther away. Living farther away is a different life for a child.</p>
        <button class="ghost" id="widen">Show me Savannah anyway</button>` : ""}
    </main>`;
}
function brief(){
  const p = POOL.find(x => x.id===selected) || POOL[0];
  return `<header class="top"><div class="brand">Their plan</div>
    <h1>${p.job}</h1>
    <div class="sub">${p.name} · ${p.city}</div></header>
    <main>
      <p>${p.letter}</p>
      <div class="label">You already agree</div>
      ${p.agree.map(x=>`<div class="row"><span>${x}</span></div>`).join("")}
      <div class="label">You still need to decide</div>
      ${p.decide.map(x=>`<div class="row"><span>${x}</span></div>`).join("")}
      ${p.conflict.length?`<div class="label">You do not agree</div>${p.conflict.map(x=>`<div class="row"><span>${x}</span></div>`).join("")}`:""}
      <div class="stack">
        <button id="request">Ask to talk</button>
        <button class="ghost" data-go="intros">Not this person</button>
      </div>
    </main>`;
}
function thread(){
  const p = POOL.find(x => x.id===selected) || POOL[0];
  return `<header class="top"><div class="brand">Lane, Mora, and ${p.name}</div>
    <h1>Everyone in this plan is in this conversation.</h1>
    <div class="sub">They said yes yesterday. There is no private side chat.</div></header>
    <main>
      <div class="msg"><div class="muted">${p.name}</div>I read where we agree. School district is the thing I want a therapist in the room for.</div>
      <div class="msg us"><div class="muted">Lane</div>Same. Avery can sit with us before we talk about a clinic.</div>
      <div class="stack">
        <button class="ghost" data-go="refusal">See what a closed door looks like</button>
        <button class="ghost" data-go="record">Back to your plan</button>
      </div>
    </main>`;
}
function refusal(){
  return `<header class="top"><div class="brand">Intended</div>
    <h1>We cannot recommend that you start yet.</h1></header>
    <main>
      <p>As written, Georgia would not treat both of you as parents when this child is born. That is not a delay. It is us refusing to let you begin a pregnancy that the law will not hold.</p>
      <div class="stack"><button data-go="record">Back to your plan</button></div>
    </main>`;
}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-brief]").forEach(b => b.onclick = () => go("brief", b.dataset.brief));
  const w = document.getElementById("widen");
  if(w) w.onclick = () => { widen = true; go("intros"); };
  const r = document.getElementById("request");
  if(r) r.onclick = () => go("thread");
}
render();
</script>
</body>
</html>
