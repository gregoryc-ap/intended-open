<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Intended</title>
<style>
:root{--paper:#F6F1EA;--ink:#1C1917;--muted:#6B645C;--line:#E4D9CC;--card:#FFFcf7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;-webkit-text-size-adjust:100%}
.phone{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
header.top{padding:20px 22px 10px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.switch{font-size:13px;color:var(--muted);margin-top:6px}
h1{font-weight:500;font-size:26px;line-height:1.2;margin:8px 0 6px}
.sub,.muted{color:var(--muted);font-size:14px;line-height:1.45}
main{flex:1;padding:16px 22px 110px}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500;text-align:right}
button{appearance:none;border:0;background:var(--ink);color:var(--paper);padding:14px 16px;width:100%;font-family:inherit;font-size:16px;margin-top:10px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.path{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
button.path b{display:block;font-weight:500;font-size:17px;margin-bottom:4px}
button.path span{display:block;color:var(--muted);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:transparent;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:16px 2px;margin:0}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.off{opacity:.35}
.brief,.notice{background:var(--card);border:1px solid var(--line);padding:14px;margin:12px 0}
.msg{margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line)}
.msg.us{margin-left:20px;background:#F3EBE0}
.stack{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const PATHS = {
  together:{id:"together",label:"Raise a child together",people:true,price:"$2,999",who:"Lane & Mora"},
  donor:{id:"donor",label:"Help someone conceive — not as a parent",people:true,price:"$2,399",who:"Riley"},
  have:{id:"have",label:"We already have the other adult",people:false,price:"$2,999",who:"Lane & Mora"},
  solo:{id:"solo",label:"Building alone, with a clinic",people:false,price:"$2,399",who:"Morgan"},
  unsure:{id:"unsure",label:"Not sure yet",people:false,price:"—",who:"You"}
};
const POOL = [
  {id:"jordan",name:"Jordan",city:"Decatur",inside:true,rail:"together",job:"Wants to raise a child with you",
    letter:"I want to be a parent on paper, not a visitor. Same schools. I will not move the child out of this part of Atlanta.",
    agree:["Both of you want to be legal parents","A clinic, not home","Two homes in the same city"],
    decide:["Which school district","How a new partner shows up in year one"],conflict:[]},
  {id:"priya",name:"Priya",city:"Atlanta",inside:true,rail:"together",job:"Wants to raise a child with you",
    letter:"I want a child who knows both parents from the first day. Public school. I do not want to live in the same house.",
    agree:["Both of you want to be legal parents","Atlanta","A clinic"],
    decide:["One home or two","Faith in the home"],conflict:[]},
  {id:"sam",name:"Sam",city:"Savannah",inside:false,rail:"together",job:"Wants to raise a child with you",
    letter:"I would parent with someone who will stay in Georgia. I can visit. I cannot move in the first year.",
    agree:["Both of you want to be legal parents","Give birth in Georgia"],
    decide:["Where the child sleeps"],
    conflict:["You asked to stay nearby. Savannah is farther than that."]},
  {id:"casey",name:"Casey",city:"Atlanta",inside:true,rail:"donor",job:"Looking for someone who will not be a parent",
    letter:"We will conceive at a clinic. We will tell the child the truth. We are not asking you to raise them.",
    agree:["Clinic only","You will not be a legal parent","The child will be told"],
    decide:["Written updates or a meeting later"],conflict:[]}
];
let path = null, view = "start", selected = null, widen = false;
function go(v,id){view=v;if(id!==undefined)selected=id;render();}
function setPath(id){path=id;widen=false;selected=null;view=id==="unsure"?"learn":"plan";render();}
function render(){
  const el=document.getElementById("app");
  const screens={start,plan,support,papers,people,brief,thread,refuse,learn};
  el.innerHTML=(screens[view]||start)()+((view==="start"||view==="brief"||view==="thread"||view==="refuse")?"":tabs());
  bind();
}
function tabs(){
  const p=PATHS[path]||PATHS.together;
  const t=(id,label,ok)=>`<button class="${view===id?"on":""} ${ok?"":"off"}" data-go="${ok?id:"plan"}">${label}</button>`;
  return `<nav class="tabs">${t("plan","Plan",true)}${t("support","Support",path!=="unsure")}${t("papers","Papers",path!=="unsure")}${t("people","People",p.people)}</nav>`;
}
function start(){
  return `<header class="top"><div class="brand">Intended</div>
    <h1>What family are you building?</h1>
    <div class="sub">You can change your mind. You cannot do two of these at once.</div></header>
    <main class="stack">
      ${Object.values(PATHS).map(p=>`<button class="path" data-path="${p.id}"><b>${p.label}</b><span>${p.people?"You may meet someone, after the plan is complete.":"You will not be shown other people."}</span></button>`).join("")}
    </main>`;
}
function plan(){
  const p=PATHS[path];
  const together=path==="together";
  const donor=path==="donor";
  return `<header class="top"><div class="brand">Intended</div>
    <h1>${p.who}</h1>
    <div class="sub">${path==="unsure"?"Read first. You are not cleared to start a pregnancy.":"You are not cleared to start a pregnancy yet."}</div>
    <div class="switch" data-go="start">Try another kind of plan</div></header>
    <main>
      <div class="label">Your plan</div>
      <div class="row"><span>You are here to</span><b>${p.label}</b></div>
      <div class="row"><span>You live in</span><b>Atlanta</b></div>
      <div class="row"><span>Birth would be in</span><b>Georgia</b></div>
      <div class="row"><span>How you would conceive</span><b>${donor||together||path==="solo"||path==="have"?"At a clinic":"Not yet"}</b></div>
      ${together?`<div class="row"><span>Who you can meet</span><b>Same city, county, or about fifty miles</b></div>`:""}
      ${donor?`<div class="row"><span>Families already helped</span><b>1 of 5 on Intended</b></div>`:""}
      ${!p.people?`<div class="notice">People nearby is closed on this plan. You already have what you need, or you are not meeting someone here.</div>`:""}
      <div class="label">How Georgia treats parents like you</div>
      <p class="muted">${donor?"If you stay off the certificate and you use a clinic, Georgia can treat you as a donor — not a parent. That only holds if you do not try to parent later.":"Georgia often will not name both intended parents before the baby is born. Plan to finish the legal work after birth unless a lawyer writes another path."}</p>
      <button data-go="support">See your year of support</button>
      ${p.people?`<button class="ghost" data-go="people">See people nearby</button>`:""}
    </main>`;
}
function support(){
  const p=PATHS[path];
  return `<header class="top"><div class="brand">Support · ${p.price}</div>
    <h1>Time with real people, when you need it.</h1>
    <div class="sub">Priced as if you will use every hour. Household $2,999. One adult $2,399. Work can attach this as a benefit.</div></header>
    <main>
      <div class="row"><span>A lawyer</span><b>3 hours</b></div>
      <div class="muted">Independent counsel. We do not sell a contract that binds you.</div>
      <div class="row"><span>A therapist</span><b>4 hours</b></div>
      <div class="muted">The first visit walks through where you agree and where you do not.</div>
      <div class="row"><span>A clinician</span><b>2 hours</b></div>
      <div class="muted">Before anyone says you are ready to try. Not your fertility clinic.</div>
      <div class="row"><span>A money planner</span><b>2 hours</b></div>
      <div class="label">How you pay</div>
      <p class="muted">Once a year, each month, taken from a paycheck if work offers it, or billed to the company.</p>
      <p class="muted">Avery keeps this organized. Avery is not your lawyer.</p>
      <button data-go="papers">See what is finished</button>
    </main>`;
}
function papers(){
  return `<header class="top"><div class="brand">Papers</div>
    <h1>What is finished, and what is not.</h1>
    <div class="sub">Medical treatment is not part of this.</div></header>
    <main>
      <div class="row"><span>Your written plan</span><b>Started</b></div>
      <div class="row"><span>Notes for two lawyers</span><b>Not a contract we sell</b></div>
      <div class="row"><span>Letters from lawyers</span><b>Not yet</b></div>
      <div class="row"><span>Money conversation</span><b>Started</b></div>
      <div class="row"><span>Birth certificate</span><b>Not yet</b></div>
      <p class="muted">If you need a gestational carrier or a bank, we will name the kind of licensed help. We will not run that list here.</p>
      <button class="ghost" data-go="refuse">See what a closed door looks like</button>
    </main>`;
}
function people(){
  const p=PATHS[path];
  if(!p.people){
    return `<header class="top"><div class="brand">People nearby</div>
      <h1>This plan does not show other people.</h1>
      <div class="sub">You already have the other adult, or you are building with a clinic alone.</div></header>
      <main><button data-go="plan">Back to your plan</button></main>`;
  }
  const rail=path==="donor"?"donor":"together";
  const list=POOL.filter(x=>x.rail===rail&&(x.inside||widen));
  const hidden=rail==="together"&&!widen;
  const cards=list.map(x=>`<div class="brief"><div style="font-size:18px;margin-bottom:6px">${x.job}</div>
    <div class="muted">${x.name} · ${x.city}</div><p>${x.letter}</p>
    <div class="row"><span>You already agree</span><b>${x.agree.length}</b></div>
    <div class="row"><span>You still need to decide</span><b>${x.decide.length}</b></div>
    <div class="row"><span>You do not agree</span><b>${x.conflict.length}</b></div>
    <button data-brief="${x.id}">Read their plan</button></div>`).join("");
  return `<header class="top"><div class="brand">People nearby</div>
    <h1>${rail==="donor"?"People looking for a donor who will not parent":"People who want to raise a child with you"}</h1>
    <div class="sub">${rail==="donor"?"A clinic. Not home. Not sex. We will not show how many miles.":"Same city, same county, or about fifty miles. We will not show how many miles."}</div></header>
    <main>
      ${rail==="together"?`<div class="notice">Someone in this city who only wants to donate is not on this list. Someone in New York is not on this list.</div>`:`<div class="notice">You have helped one family. The cap here is five. If you later want to parent, you leave this path.</div>`}
      ${cards}
      ${hidden?`<p class="muted">There are people farther away. Living farther away is a different life for a child.</p><button class="ghost" id="widen">Show me Savannah anyway</button>`:""}
    </main>`;
}
function brief(){
  const x=POOL.find(i=>i.id===selected)||POOL[0];
  return `<header class="top"><div class="brand">Their plan</div>
    <h1>${x.job}</h1><div class="sub">${x.name} · ${x.city}</div></header>
    <main>
      <p>${x.letter}</p>
      <div class="label">You already agree</div>${x.agree.map(s=>`<div class="row"><span>${s}</span></div>`).join("")}
      <div class="label">You still need to decide</div>${x.decide.map(s=>`<div class="row"><span>${s}</span></div>`).join("")}
      ${x.conflict.length?`<div class="label">You do not agree</div>${x.conflict.map(s=>`<div class="row"><span>${s}</span></div>`).join("")}`:""}
      <button id="request">Ask to talk</button>
      <button class="ghost" data-go="people">Not this person</button>
    </main>`;
}
function thread(){
  const x=POOL.find(i=>i.id===selected)||POOL[0];
  const names=path==="together"?`Lane, Mora, and ${x.name}`:`Riley and ${x.name}`;
  return `<header class="top"><div class="brand">${names}</div>
    <h1>Everyone in this plan is in this conversation.</h1>
    <div class="sub">They said yes yesterday. There is no private side chat.</div></header>
    <main>
      <div class="msg"><div class="muted">${x.name}</div>I read where we agree. I want a therapist in the room before anyone books a clinic.</div>
      <div class="msg us"><div class="muted">${path==="together"?"Lane":"Riley"}</div>Same. Avery can sit with us first.</div>
      <button class="ghost" data-go="refuse">See what a closed door looks like</button>
      <button class="ghost" data-go="plan">Back to your plan</button>
    </main>`;
}
function refuse(){
  return `<header class="top"><div class="brand">Intended</div>
    <h1>We cannot recommend that you start yet.</h1></header>
    <main>
      <p>As written, the law where this child would be born would not treat the adults the way your plan says. That is not a delay. It is us refusing to let you begin a pregnancy the law will not hold.</p>
      <p class="muted">You can change the birth state, finish the papers with two lawyers, or wait.</p>
      <button data-go="plan">Back to your plan</button>
    </main>`;
}
function learn(){
  return `<header class="top"><div class="brand">Intended</div>
    <h1>Read first.</h1>
    <div class="sub">You are not meeting anyone yet.</div>
    <div class="switch" data-go="start">Choose a plan when you know</div></header>
    <main>
      <p>Intended is for people who want a child to leave the hospital with the right parents on paper.</p>
      <p class="muted">If you want to raise a child with someone, they need to live nearby unless you both say otherwise. If you want to help someone conceive, that happens at a clinic, and you will not be a parent.</p>
      <p class="muted">We do not match gestational carriers. We do not keep a catalog of eggs or sperm.</p>
      <button data-go="start">Choose what you are here to do</button>
    </main>`;
}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-path]").forEach(b=>b.onclick=()=>setPath(b.dataset.path));
  document.querySelectorAll("[data-brief]").forEach(b=>b.onclick=()=>go("brief",b.dataset.brief));
  const w=document.getElementById("widen"); if(w) w.onclick=()=>{widen=true;go("people");};
  const r=document.getElementById("request"); if(r) r.onclick=()=>go("thread");
}
render();
</script>
</body>
</html>
